<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ViveSmart | Muy pronto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        height: 100%;
        overflow: hidden;
        font-family: 'Inter', sans-serif;
        background: #05070d;
        color: #fff;
    }

    /* Fondo animado con orbes de luz */
    .bg {
        position: fixed;
        inset: 0;
        z-index: -2;
        background:
            radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.35), transparent 45%),
            radial-gradient(circle at 80% 30%, rgba(236, 72, 153, 0.25), transparent 45%),
            radial-gradient(circle at 50% 90%, rgba(34, 211, 238, 0.25), transparent 50%),
            #05070d;
        animation: bgShift 18s ease-in-out infinite alternate;
    }

    @keyframes bgShift {
        0%   { filter: hue-rotate(0deg); transform: scale(1); }
        100% { filter: hue-rotate(25deg); transform: scale(1.08); }
    }

    /* Rejilla sutil */
    .grid {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-image:
            linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
        background-size: 60px 60px;
        mask-image: radial-gradient(circle at 50% 50%, #000 40%, transparent 85%);
        -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 40%, transparent 85%);
    }

    .wrapper {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
    }

    .card {
        width: 100%;
        max-width: 720px;
        padding: 56px 48px;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        box-shadow:
            0 30px 80px rgba(0, 0, 0, 0.55),
            inset 0 1px 0 rgba(255, 255, 255, 0.08);
        text-align: center;
        animation: fadeUp 1s ease both;
    }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(30px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        border-radius: 999px;
        background: rgba(99, 102, 241, 0.15);
        border: 1px solid rgba(99, 102, 241, 0.4);
        color: #c7d2fe;
        font-size: 0.8rem;
        font-weight: 500;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        margin-bottom: 28px;
    }

    .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #818cf8;
        box-shadow: 0 0 12px #818cf8;
        animation: pulse 1.6s ease-in-out infinite;
    }

    @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.7); }
    }

    .logo {
        font-family: 'Space Grotesk', sans-serif;
        font-size: clamp(2.4rem, 6vw, 3.6rem);
        font-weight: 700;
        letter-spacing: -1.5px;
        line-height: 1;
        margin-bottom: 18px;
        background: linear-gradient(120deg, #ffffff 0%, #a5b4fc 50%, #f0abfc 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .logo em {
        font-style: normal;
        background: linear-gradient(120deg, #22d3ee, #818cf8);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    h1 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: clamp(1.1rem, 2.4vw, 1.45rem);
        font-weight: 500;
        color: #e5e7eb;
        margin-bottom: 14px;
        letter-spacing: -0.3px;
    }

    .sub {
        font-size: 0.98rem;
        color: #9ca3af;
        line-height: 1.7;
        max-width: 480px;
        margin: 0 auto 40px;
        font-weight: 300;
    }

    /* Cuenta atrás */
    .countdown {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
        margin-bottom: 42px;
    }

    .time-box {
        padding: 18px 8px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .time-box:hover {
        transform: translateY(-4px);
        border-color: rgba(129, 140, 248, 0.5);
    }

    .time-box .num {
        font-family: 'Space Grotesk', sans-serif;
        font-size: clamp(1.6rem, 4vw, 2.2rem);
        font-weight: 700;
        color: #fff;
        display: block;
        line-height: 1;
        font-variant-numeric: tabular-nums;
    }

    .time-box .label {
        display: block;
        margin-top: 8px;
        font-size: 0.68rem;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #818cf8;
        font-weight: 500;
    }

    /* Formulario */
    form {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
        max-width: 500px;
        margin: 0 auto;
    }

    input[type="email"] {
        flex: 1;
        min-width: 220px;
        padding: 16px 20px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(0, 0, 0, 0.3);
        color: #fff;
        font-size: 0.95rem;
        font-family: 'Inter', sans-serif;
        outline: none;
        transition: border-color 0.3s, box-shadow 0.3s;
    }

    input[type="email"]::placeholder { color: #6b7280; }

    input[type="email"]:focus {
        border-color: #818cf8;
        box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.15);
    }

    button {
        padding: 16px 30px;
        border: none;
        border-radius: 14px;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: 0.3px;
        color: #05070d;
        cursor: pointer;
        background: linear-gradient(120deg, #a5b4fc, #f0abfc);
        transition: transform 0.25s ease, box-shadow 0.3s ease;
        white-space: nowrap;
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 30px rgba(165, 180, 252, 0.35);
    }

    button:active { transform: translateY(0); }

    .footer {
        margin-top: 40px;
        padding-top: 26px;
        border-top: 1px solid rgba(255, 255, 255, 0.07);
        font-size: 0.85rem;
        color: #6b7280;
    }

    .footer a {
        color: #a5b4fc;
        text-decoration: none;
        font-weight: 500;
        transition: color 0.3s;
    }

    .footer a:hover { color: #f0abfc; }

    /* Redes sociales */
    .socials {
        display: flex;
        justify-content: center;
        gap: 14px;
        margin-top: 22px;
    }

    .socials a {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #9ca3af;
        transition: all 0.3s ease;
    }

    .socials a:hover {
        color: #fff;
        background: rgba(129, 140, 248, 0.2);
        border-color: rgba(129, 140, 248, 0.5);
        transform: translateY(-3px);
    }

    .socials svg { width: 18px; height: 18px; }

    @media (max-width: 520px) {
        .card { padding: 40px 24px; border-radius: 22px; }
        .countdown { gap: 8px; }
        .time-box { padding: 14px 4px; border-radius: 12px; }
        form { flex-direction: column; }
        button { width: 100%; }
    }
</style>
</head>
<body>
    <div class="bg"></div>
    <div class="grid"></div>

    <div class="wrapper">
        <div class="card">
            <div class="badge">
                <span class="dot"></span>
                Próximo lanzamiento
            </div>

            <div class="logo">Vive<em>Smart</em></div>

            <h1>Estamos construyendo algo increíble</h1>
            <p class="sub">
                Nuestra nueva tienda virtual llega con pagos seguros, login inteligente
                y una experiencia pensada para ti. Déjanos tu correo y sé el primero en enterarte.
            </p>

            <div class="countdown">
                <div class="time-box"><span class="num" id="dias">00</span><span class="label">Días</span></div>
                <div class="time-box"><span class="num" id="horas">00</span><span class="label">Horas</span></div>
                <div class="time-box"><span class="num" id="min">00</span><span class="label">Min</span></div>
                <div class="time-box"><span class="num" id="seg">00</span><span class="label">Seg</span></div>
            </div>

            <form onsubmit="event.preventDefault(); alert('¡Gracias! Te avisaremos el día del lanzamiento 🚀'); this.reset();">
                <input type="email" placeholder="tucorreo@email.com" required>
                <button type="submit">Avísame</button>
            </form>

            <div class="footer">
                ¿Consultas? Escríbenos a <a href="mailto:hola@vivesmart.com">hola@vivesmart.com</a>
                <div class="socials">
                    <a href="#" aria-label="Instagram">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
                    </a>
                    <a href="#" aria-label="Facebook">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
                    </a>
                    <a href="#" aria-label="X">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ⚙️ Cambia esta fecha por la de tu lanzamiento real
        const FECHA_LANZAMIENTO = new Date("2026-12-31T00:00:00").getTime();

        const $ = id => document.getElementById(id);

        function actualizar() {
            const ahora = Date.now();
            const diff = FECHA_LANZAMIENTO - ahora;

            if (diff <= 0) {
                document.querySelector(".countdown").innerHTML =
                    "<p style='grid-column:1/-1; color:#a5b4fc; font-weight:600; font-size:1.1rem;'>🚀 ¡Ya estamos en línea!</p>";
                return;
            }

            const d = Math.floor(diff / 86400000);
            const h = Math.floor((diff % 86400000) / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            const s = Math.floor((diff % 60000) / 1000);

            $("dias").textContent  = String(d).padStart(2, "0");
            $("horas").textContent = String(h).padStart(2, "0");
            $("min").textContent   = String(m).padStart(2, "0");
            $("seg").textContent   = String(s).padStart(2, "0");
        }

        actualizar();
        setInterval(actualizar, 1000);
    </script>
</body>
</html>
